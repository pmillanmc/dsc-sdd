<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Plantilla del tablero. gen-dashboard.mjs la copia inyectando los datos y
     escribe dashboard/index.html. Editá este archivo, nunca el generado.

     default-src 'none' implica connect-src 'none': aun con una inyeccion
     exitosa no hay canal de exfiltracion. El dashboard no necesita red.
     script-src 'unsafe-inline' y no 'self': se abre con file://. Ver DEC-005. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:;">
<title>Discovery — Dashboard</title>
<style>
  :root {
    --bg:#f6f7f9; --surface:#fff; --line:#e3e6ea; --text:#14181f; --muted:#5c6673;
    --green:#1a7f4b; --yellow:#a86500; --red:#b3261e; --accent:#2d5bd7; --idle:#98a1ad;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#14171c; --surface:#1c2128; --line:#2c333d; --text:#e6eaef; --muted:#9aa4b1;
      --green:#4ec98a; --yellow:#e0a33a; --red:#f08076; --accent:#7aa2f7; --idle:#6b7580;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:26px 22px 60px; background:var(--bg); color:var(--text);
    font:14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width:1120px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 3px; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:12.5px; }
  nav { display:flex; gap:4px; margin:22px 0 18px; border-bottom:1px solid var(--line); }
  nav button {
    background:none; border:0; border-bottom:2px solid transparent; color:var(--muted);
    padding:9px 15px; font:inherit; font-size:13.5px; cursor:pointer; margin-bottom:-1px;
  }
  nav button[aria-selected="true"] { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:19px; margin-bottom:16px; }
  .card h2 { font-size:15.5px; margin:0 0 2px; }
  .card h3 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 0 9px; }
  .card .meta { color:var(--muted); font-size:12.5px; margin-bottom:15px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:6px; }
  .bar > i { display:block; height:100%; background:var(--green); }
  .pct { font-size:12.5px; color:var(--muted); margin-bottom:16px; }
  .chain { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
  .step { flex:1 1 100px; min-width:100px; padding:8px 9px; border-radius:6px; border:1px solid var(--line); background:var(--bg); font-size:11.5px; }
  .step .n { font-weight:600; display:block; }
  .step .s { color:var(--muted); font-size:10.5px; }
  .step .f { display:block; color:var(--muted); font-size:10px; margin-top:3px; opacity:.85; }
  .step[data-e="APPROVED"] { border-color:var(--green); } .step[data-e="APPROVED"] .s { color:var(--green); }
  .step[data-e="STALE"], .step[data-e="CHANGES_REQUESTED"] { border-color:var(--yellow); }
  .step[data-e="STALE"] .s, .step[data-e="CHANGES_REQUESTED"] .s { color:var(--yellow); }
  .step[data-e="REJECTED"], .step[data-e="FAILED"] { border-color:var(--red); }
  .step[data-e="REJECTED"] .s, .step[data-e="FAILED"] .s { color:var(--red); }
  .step[data-e="IN_REVIEW"] .s, .step[data-e="AWAITING_APPROVAL"] .s, .step[data-e="IN_PROGRESS"] .s { color:var(--accent); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .tile { border:1px solid var(--line); border-left-width:3px; border-radius:8px; padding:11px 13px; background:var(--bg); }
  .tile[data-c="green"]  { border-left-color:var(--green); }
  .tile[data-c="yellow"] { border-left-color:var(--yellow); }
  .tile[data-c="red"]    { border-left-color:var(--red); }
  .tile[data-c="none"]   { border-left-color:var(--idle); }
  .tile .k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .tile .v { font-size:21px; font-weight:600; margin-top:3px; letter-spacing:-.02em; }
  .tile .v.nd { font-size:12.5px; font-weight:400; color:var(--muted); line-height:1.4; padding:4px 0; }
  .tile .u { font-size:11px; color:var(--muted); }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  tbody tr:last-child td { border-bottom:0; }
  .pill { display:inline-block; font-size:11px; padding:1px 8px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }
  .pill[data-c="green"] { color:var(--green); border-color:var(--green); }
  .pill[data-c="yellow"] { color:var(--yellow); border-color:var(--yellow); }
  .pill[data-c="red"] { color:var(--red); border-color:var(--red); }
  .block { border:1px solid var(--yellow); border-radius:8px; padding:11px 13px; margin-bottom:8px; background:var(--bg); }
  .block .t { font-weight:600; font-size:12.5px; color:var(--yellow); }
  .block .d { font-size:13px; margin:3px 0 6px; }
  code { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12.5px; color:var(--accent);
         background:var(--surface); border:1px solid var(--line); border-radius:5px; padding:2px 7px; display:inline-block; }
  .next { margin-top:16px; padding:12px 14px; border-radius:8px; background:var(--bg); border:1px solid var(--line); }
  .next .lbl { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .empty { color:var(--muted); padding:6px 0; }
  .viejo {
    color:var(--yellow); font-size:12px; margin:-9px 0 14px;
    padding:7px 9px; border-radius:6px;
    border:1px solid var(--yellow); background:var(--bg);
  }
  .warn { color:var(--yellow); font-size:12.5px; margin-bottom:12px; }
  footer { color:var(--muted); font-size:11.5px; margin-top:26px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Discovery</h1>
  <div class="sub" id="sub"></div>
  <nav id="nav" role="tablist"></nav>
  <div id="vista"></div>
  <footer id="pie"></footer>
</div>

<!--DSC_DATOS-->
<script>
/* Todo dato de artefacto entra por textContent. Nunca innerHTML con datos:
   el contenido sale de minutas y mails de terceros. Ver constitution.md. */
(function () {
  'use strict';
  var D = window.DSC_DATA;
  var vista = document.getElementById('vista');

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x !== undefined && x !== null) n.textContent = String(x);
    return n;
  }
  function attr(n, k, v) { n.setAttribute(k, v); return n; }
  function fecha(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return isNaN(d) ? '—' : d.toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }
  /* Fecha corta: la pregunta de un tablero de etapas es de dias, no de horas. */
  function fechaCorta(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return isNaN(d) ? '—' : d.toLocaleDateString('es-AR', { day:'2-digit', month:'short' });
  }
  /* "mismo dia" en vez de "0 dias": una etapa que arranco y cerro hoy no tardo cero. */
  function dias(n) {
    if (n === null || n === undefined) return '';
    if (n < 1) return 'mismo día';
    var r = Math.round(n);
    return r + (r === 1 ? ' día' : ' días');
  }
  function tabla(cols, filas) {
    var w = el('div','scroll'), t = document.createElement('table');
    var th = document.createElement('thead'), tr = document.createElement('tr');
    cols.forEach(function(c){ tr.appendChild(el('th',null,c)); });
    th.appendChild(tr); t.appendChild(th);
    var tb = document.createElement('tbody');
    filas.forEach(function(f){
      var r = document.createElement('tr');
      f.forEach(function(c){
        var td = document.createElement('td');
        if (c && c.nodeType) td.appendChild(c); else td.textContent = (c === null || c === undefined) ? '—' : String(c);
        r.appendChild(td);
      });
      tb.appendChild(r);
    });
    t.appendChild(tb); w.appendChild(t); return w;
  }
  /* Una metrica sin datos se dice, no se muestra en cero: la diferencia entre
     "es cero" y "no lo sabemos" cambia las decisiones. */
  function tile(k, m, unidad) {
    var d = el('div','tile');
    attr(d, 'data-c', (m && m.color) ? m.color : 'none');
    d.appendChild(el('div','k',k));
    if (!m || !m.disponible) {
      d.appendChild(el('div','v nd','Sin datos suficientes todavía'));
    } else {
      d.appendChild(el('div','v', m.valor));
      if (unidad) d.appendChild(el('div','u',unidad));
    }
    return d;
  }

  if (!D) {
    vista.appendChild(el('div','card empty','No hay datos. Corré /dsc-status para generar el dashboard.'));
    return;
  }
  document.getElementById('sub').textContent = 'Generado ' + fecha(D.generado);

  /* ── Ejecutivo ─────────────────────────────────────────────────────────── */
  function ejecutivo() {
    var f = document.createDocumentFragment();
    if (!D.proyectos.length) {
      f.appendChild(el('div','card empty','Todavía no hay proyectos. Corré /dsc-new <nombre>.'));
      return f;
    }
    D.proyectos.forEach(function (p) {
      var c = el('div','card');
      c.appendChild(el('h2', null, p.sin_metricas ? (p.nombre || p.slug) : p.general.nombre));
      if (p.sin_metricas) {
        c.appendChild(el('div','meta', p.iniciativa + ' · ' + p.slug));
        c.appendChild(el('div','empty', p.mensaje));
        f.appendChild(c); return;
      }
      c.appendChild(el('div','meta',
        p.general.iniciativa + ' · ' + p.slug +
        (p.general.owner ? ' · ' + p.general.owner : '') +
        ' · actualizado ' + fecha(p.general.actualizado)));

      /* Metricas viejas: el proyecto se movio despues del ultimo calculo. Se avisa
         en la tarjeta, no en un pie, porque los numeros de abajo son los viejos. */
      if (p.desactualizado) {
        c.appendChild(el('div','viejo',
          'Métricas desactualizadas: el proyecto se movió el ' + fechaCorta(p.estado_updated) +
          ' y los números son del ' + fechaCorta(p.generated) +
          '. Corré /dsc-metrics para recalcular.'));
      }

      var bar = el('div','bar'), fill = document.createElement('i');
      fill.style.width = p.progreso.valor + '%'; bar.appendChild(fill); c.appendChild(bar);
      c.appendChild(el('div','pct', p.progreso.aprobadas + ' de ' + p.progreso.total + ' etapas aprobadas (' + p.progreso.valor + '%)'));

      var chain = el('div','chain');
      /* Fechas por etapa. Vienen en `cronologia` y no en `etapas` porque
         gen-dashboard.mjs sobreescribe `etapas` con las definiciones del workflow. */
      var crono = {};
      (p.cronologia || []).forEach(function (x) { crono[x.id] = x; });
      (p.etapas || []).forEach(function (e) {
        var fila = p.artefactos.filter(function(a){ return a.etapa === e.id; });
        var est = fila.length ? (fila.every(function(a){return a.estado==='APPROVED';}) ? 'APPROVED' : fila[0].estado) : 'PENDING';
        var s = attr(el('div','step'), 'data-e', est);
        s.appendChild(el('span','n', e.name || e.id));
        s.appendChild(el('span','s', est.toLowerCase().replace(/_/g,' ')));
        var k = crono[e.id];
        if (k && (k.started_at || k.approved_at)) {
          /* Etapa cerrada: inicio → aprobacion y cuanto llevo.
             Etapa en curso: solo el inicio, que es el dato que importa.
             Etapa vieja sin `started_at`: se muestra la aprobacion sola. No se
             inventa un inicio — ver contracts/state.md. */
          var txt = k.approved_at
            ? fechaCorta(k.started_at) + ' → ' + fechaCorta(k.approved_at)
            : 'desde ' + fechaCorta(k.started_at);
          var d = dias(k.dias);
          s.appendChild(el('span','f', d ? txt + ' · ' + d : txt));
        }
        chain.appendChild(s);
      });
      c.appendChild(chain);

      c.appendChild(el('h3',null,'Indicadores'));
      var t = el('div','tiles');
      t.appendChild(tile('Progreso', p.progreso, '%'));
      t.appendChild(tile('Calidad', { disponible:true, valor:p.calidad.indice, color:p.calidad.indice>=80?'green':p.calidad.indice>=60?'yellow':'red' }, '/ 100'));
      t.appendChild(tile('Bloqueos', p.bloqueos, ''));
      t.appendChild(tile('Tiempo de ciclo', p.proceso.cycleTime, 'días'));
      t.appendChild(tile('Retrabajo', p.proceso.rework, '%'));
      t.appendChild(tile('Throughput', p.proceso.throughput, '/ mes'));
      t.appendChild(tile('Eficiencia de flujo', p.proceso.flowEfficiency, '%'));
      t.appendChild(tile('Tasa de aprobación', p.aprobaciones.tasa_aprobacion, '%'));
      c.appendChild(t);

      if (p.riesgos.alto || p.riesgos.medio) {
        c.appendChild(el('h3',null,'Riesgos'));
        c.appendChild(el('div',null, p.riesgos.alto + ' altos · ' + p.riesgos.medio + ' medios · ' + p.riesgos.bajo + ' bajos'));
      }

      if (p.bloqueos.lista.length) {
        c.appendChild(el('h3',null,'Qué está frenando'));
        p.bloqueos.lista.forEach(function (b) {
          var d = el('div','block');
          d.appendChild(el('div','t', b.tipo));
          d.appendChild(el('div','d', b.detalle));
          d.appendChild(el('code', null, b.comando));
          c.appendChild(d);
        });
      }

      var nx = el('div','next');
      nx.appendChild(el('div','lbl','Próxima acción'));
      nx.appendChild(el('div',null,p.next_action));
      nx.appendChild(el('code',null,p.next_command));
      c.appendChild(nx);
      f.appendChild(c);
    });
    return f;
  }

  /* ── Operativo ─────────────────────────────────────────────────────────── */
  function operativo() {
    var f = document.createDocumentFragment();
    var conM = D.proyectos.filter(function(p){ return !p.sin_metricas; });
    if (!conM.length) {
      f.appendChild(el('div','card empty','Sin métricas calculadas. Corré /dsc-metrics.'));
      return f;
    }
    conM.forEach(function (p) {
      var c = el('div','card');
      c.appendChild(el('h2',null,p.general.nombre));
      c.appendChild(el('div','meta','Detalle operativo · etapa actual: ' + p.general.etapa_actual));

      c.appendChild(el('h3',null,'Artefactos'));
      c.appendChild(tabla(
        ['Etapa','Ítem','Estado','v','Aprobado','Pendiente de','Tomado por','Líneas'],
        p.artefactos.map(function (a) {
          var est = a.causa_stale ? a.estado + ' (' + a.causa_stale + ')' : a.estado;
          var lin = a.lineas === null ? null : (a.limite && a.lineas > a.limite ? a.lineas + ' / ' + a.limite + ' ⚠' : a.lineas);
          return [a.etapa, a.item, est, a.version, fecha(a.actualizado), a.pendientes.join(', ') || null, a.tomado_por, lin];
        })));

      c.appendChild(el('h3',null,'Features'));
      var fe = p.features;
      c.appendChild(el('div',null,
        fe.total + ' en total · ' + fe.estimadas + ' estimadas · ' + fe.entregadas + ' entregadas a desarrollo'));
      var estados = Object.keys(fe.por_estado);
      if (estados.length) {
        var pills = el('div',null); pills.style.marginTop = '8px';
        estados.forEach(function(k){
          var s = el('span','pill', k + ': ' + fe.por_estado[k]); s.style.marginRight='6px'; pills.appendChild(s);
        });
        c.appendChild(pills);
      }

      c.appendChild(el('h3',null,'Revisiones y aprobaciones'));
      var sev = p.revisiones.por_severidad;
      c.appendChild(el('div',null,
        'Observaciones — críticas: ' + sev.CRITICAL + ' · mayores: ' + sev.MAJOR +
        ' · menores: ' + sev.MINOR + ' · abiertas: ' + p.revisiones.abiertas));
      c.appendChild(el('div',null,
        'Aprobaciones pendientes: ' + p.aprobaciones.pendientes.valor +
        ' · revisiones pendientes: ' + p.aprobaciones.revisiones_pendientes.valor +
        (p.aprobaciones.proximo_aprobador ? ' · próximo: ' + p.aprobaciones.proximo_aprobador : '')));

      c.appendChild(el('h3',null,'Consistencia'));
      if (p.audit.errores === null) {
        c.appendChild(el('div','empty','El audit no corrió todavía. Corré /dsc-audit.'));
      } else {
        c.appendChild(el('div',null,
          p.audit.errores + ' error(es) y ' + p.audit.avisos + ' aviso(s) · ' +
          (p.audit.determinista ? 'verificación determinista' : 'MODO DEGRADADO: no determinista') +
          ' · ' + fecha(p.audit.generado)));
      }

      c.appendChild(el('h3',null,'Decisiones'));
      c.appendChild(el('div',null,
        p.decisiones.total + ' registradas · ' + p.decisiones.activas + ' vigentes · ' + p.decisiones.superseded + ' reemplazadas'));

      f.appendChild(c);
    });
    return f;
  }

  /* ── Portfolio ─────────────────────────────────────────────────────────── */
  function portfolio() {
    var f = document.createDocumentFragment();
    var P = D.portfolio;
    var c = el('div','card');
    c.appendChild(el('h2',null,'Iniciativas'));
    c.appendChild(el('div','meta', P.iniciativas.length + ' proyecto(s) en el portfolio'));
    if (!P.iniciativas.length) {
      c.appendChild(el('div','empty','Sin iniciativas registradas.'));
    } else {
      c.appendChild(tabla(
        ['Iniciativa','Proyecto','Owner','Estado','Progreso','Calidad','Features','En Discovery','Entregadas','Bloqueos'],
        P.iniciativas.map(function (i) {
          return [i.id, i.nombre, i.owner, i.estado,
                  i.progreso === null ? null : i.progreso + '%',
                  i.calidad === null ? null : i.calidad + '/100',
                  i.features_total, i.features_discovery, i.features_entregadas, i.bloqueos];
        })));
    }
    f.appendChild(c);

    var e = el('div','card');
    e.appendChild(el('h2',null,'Entregas a desarrollo'));
    if (P.repos_inaccesibles.length) {
      P.repos_inaccesibles.forEach(function (r) {
        e.appendChild(el('div','warn','⚠ ' + r.repo + ' — ' + r.motivo + '. Se muestra lo último conocido.'));
      });
    }
    if (!P.entregas.length) {
      e.appendChild(el('div','empty','Todavía no se entregó ninguna feature a desarrollo.'));
    } else {
      e.appendChild(tabla(
        ['Discovery','Proyecto','feature_id en SDD','Talle','Entregada','Estado en SDD','Repo'],
        P.entregas.map(function (x) {
          return [x.discovery_id, x.proyecto, x.feature_id, x.size, fecha(x.entregada),
                  x.accesible ? (x.estado_sdd || 'no registrada') : 'repo no accesible', x.repo];
        })));
    }
    f.appendChild(e);
    return f;
  }

  /* ── Navegación ────────────────────────────────────────────────────────── */
  var VISTAS = [
    { id:'ejecutivo', nombre:'Ejecutivo', render:ejecutivo },
    { id:'operativo', nombre:'Operativo', render:operativo },
    { id:'portfolio', nombre:'Portfolio', render:portfolio }
  ];
  var nav = document.getElementById('nav');
  function mostrar(i) {
    [].forEach.call(nav.children, function (b, j) { b.setAttribute('aria-selected', String(i === j)); });
    vista.textContent = '';
    vista.appendChild(VISTAS[i].render());
  }
  VISTAS.forEach(function (v, i) {
    var b = el('button', null, v.nombre);
    attr(b, 'role', 'tab');
    b.addEventListener('click', function () { mostrar(i); });
    nav.appendChild(b);
  });
  mostrar(0);

  document.getElementById('pie').textContent =
    'Este tablero se regenera con cada aprobación. No lo edites: los cambios se pierden. ' +
    'Las métricas que dicen "sin datos suficientes" se calculan a partir del historial de eventos ' +
    'y aparecen a medida que el proyecto avanza.';
})();
</script>
</body>
</html>
